[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: semua rute (mis. /project/:slug) diarahkan ke index.html
# agar React Router yang menangani, bukan 404 dari Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache panjang untuk aset ber-hash di /assets (Vite memberi hash pada nama file).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
